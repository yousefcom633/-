name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          ZIP=$(ls -t *.zip | head -1)
          test -n "$ZIP"
          echo "Using: $ZIP"
          rm -rf app && mkdir app
          unzip -q "$ZIP" -d app
          if [ ! -f app/package.json ]; then
            D=$(dirname "$(find app -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)")
            test -d "$D"
            mv "$D" app_tmp && rm -rf app && mv app_tmp app
          fi
          test -f app/package.json
          ls app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses (SDK is preinstalled on the runner)
        working-directory: ${{ github.workspace }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Icons and splash sources
        run: npm run icons

      - name: Build web app
        run: |
          npm run build
          test -s dist/index.html

      - name: Add Android and sync
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html

      - name: Set version
        run: |
          F=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $F

      - name: Use fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/dr-yousef-tasks.apk"

      - name: Publish APK in Releases (download directly from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dr.Yousef Tasks build ${{ github.run_number }}
          files: dr-yousef-tasks.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: dr-yousef-tasks-apk
          path: dr-yousef-tasks.apk
          retention-days: 30
